meta:
  name: Unified APIs
  description: This is the index of unified API service and tooling repos being tracked
    by the API Evangelist network. Unified APIs (also called integration hubs, API
    aggregators, or universal connectors) abstract multiple third-party APIs behind
    a single standardized interface, enabling software teams to build one integration
    instead of many. The market has grown to 23+ vendors in 2026, covering HR, accounting,
    CRM, file storage, ATS, e-commerce, and data pipeline use cases.
  tags:
  - Aggregation
  - Normalization
  - Unified API
  - Integration
  - SaaS
  - iPaaS
  portal: null
  github: null
  repo: unified-apis
